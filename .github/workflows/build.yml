name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create GitHub Releases on tags

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build kdb-backup.exe (stripped, static)
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o kdb-backup.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kdb-backup-windows-amd64
          path: kdb-backup.exe
          if-no-files-found: error

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: kdb-backup.exe
          generate_release_notes: true